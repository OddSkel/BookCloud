name: CD - Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bookcloud-cd-main
  cancel-in-progress: false

env:
  # Google Cloud authentication
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

  # Artifact Registry / Docker images
  ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  SKIP_BUILD: "false"
  DOCKER_BUILDKIT: "1"

  # GKE
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  GKE_MACHINE_TYPE: ${{ vars.GKE_MACHINE_TYPE }}
  GKE_NUM_NODES: ${{ vars.GKE_NUM_NODES }}
  GKE_DISK_SIZE_GB: ${{ vars.GKE_DISK_SIZE_GB }}
  ROLLOUT_TIMEOUT: ${{ vars.ROLLOUT_TIMEOUT }}

  # Namespaces and Kong static IPs
  TEST_NAMESPACE: ${{ vars.TEST_NAMESPACE }}
  PROD_NAMESPACE: ${{ vars.PROD_NAMESPACE }}
  TEST_KONG_STATIC_IP_NAME: ${{ vars.TEST_KONG_STATIC_IP_NAME }}
  PROD_KONG_STATIC_IP_NAME: ${{ vars.PROD_KONG_STATIC_IP_NAME }}
  KONG_STATIC_IP_REGION: ${{ vars.KONG_STATIC_IP_REGION }}

  # Dataset
  DATASET_BUCKET: ${{ vars.DATASET_BUCKET }}
  STAGING_DATASET_GCS_URI: ${{ vars.STAGING_DATASET_GCS_URI }}
  PROD_DATASET_GCS_URI: ${{ vars.PROD_DATASET_GCS_URI }}
  IMPORT_DATASET: ${{ vars.IMPORT_DATASET }}
  PROD_IMPORT_DATASET: ${{ vars.PROD_IMPORT_DATASET }}

  # Keycloak / Kong JWT
  KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
  REALM: ${{ vars.KEYCLOAK_REALM }}
  KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
  KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
  KEYCLOAK_ADMIN_USERNAME: ${{ vars.KEYCLOAK_ADMIN_USERNAME }}
  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
  KEYCLOAK_TEST_PASSWORD: ${{ secrets.KEYCLOAK_TEST_PASSWORD }}
  KEYCLOAK_TEST_USERS: ${{ vars.KEYCLOAK_TEST_USERS }}
  KEYCLOAK_REALM_ROLES: ${{ vars.KEYCLOAK_REALM_ROLES }}

jobs:
  setup-cloud:
    name: 01-03 Setup GCP, GKE and monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Resolve scripts directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d scripts ]]; then
            echo "SCRIPTS_DIR=scripts" >> "$GITHUB_ENV"
          else
            echo "SCRIPTS_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Validate required GitHub variables
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            ARTIFACT_REGISTRY_LOCATION \
            ARTIFACT_REGISTRY_REPOSITORY \
            GKE_CLUSTER \
            GKE_LOCATION \
            TEST_NAMESPACE \
            PROD_NAMESPACE \
            TEST_KONG_STATIC_IP_NAME \
            PROD_KONG_STATIC_IP_NAME
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions variables:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$SCRIPTS_DIR"/*.sh

      - name: 01 - Configure GCP, APIs and Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/01-gcp-registry.sh"

      - name: 02 - Ensure GKE cluster and credentials
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/02-cluster-access.sh"

      - name: 03 - Install monitoring stack
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/03-monitoring.sh"

  build-images:
    name: 04 Build and push images
    runs-on: ubuntu-latest
    needs:
      - setup-cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Resolve scripts directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d scripts ]]; then
            echo "SCRIPTS_DIR=scripts" >> "$GITHUB_ENV"
          else
            echo "SCRIPTS_DIR=." >> "$GITHUB_ENV"
          fi

      - name: 04 - Build and push images
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$SCRIPTS_DIR"/*.sh
          "$SCRIPTS_DIR/04-build-push-images.sh"

  deploy-staging:
    name: 05-07 Deploy staging and run strong cloud tests
    runs-on: ubuntu-latest
    needs:
      - build-images
    env:
      K8S_NAMESPACE: ${{ vars.TEST_NAMESPACE }}
      NAMESPACE: ${{ vars.TEST_NAMESPACE }}
      KONG_STATIC_IP_NAME: ${{ vars.TEST_KONG_STATIC_IP_NAME }}
      DATASET_GCS_URI: ${{ vars.STAGING_DATASET_GCS_URI }}
      DATASET_DIR: data/data_clean/normalized_staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Resolve scripts directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d scripts ]]; then
            echo "SCRIPTS_DIR=scripts" >> "$GITHUB_ENV"
          else
            echo "SCRIPTS_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$SCRIPTS_DIR"/*.sh

      - name: 02 - Get GKE credentials
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/02-cluster-access.sh"

      - name: 05 - Deploy staging
        shell: bash
        run: |
          set -euo pipefail
          printf 'YES\n' | "$SCRIPTS_DIR/05-deploy.sh"

      - name: Wait for auth/proxy deployments
        shell: bash
        run: |
          set -euo pipefail

          for deployment in keycloak-db keycloak; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${deployment}" --timeout="${ROLLOUT_TIMEOUT:-600s}"
          done

      - name: 07 - Configure staging Keycloak/Kong JWT
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/07-keycloak.sh"

      - name: 06 - Import staging dataset
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/06-import-dataset.sh"

      - name: Resolve staging URL and Keycloak token
        shell: bash
        run: |
          set -euo pipefail

          external_ip=""

          for i in {1..60}; do
            external_ip="$(kubectl -n "$K8S_NAMESPACE" get svc kong -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"

            if [[ -n "$external_ip" ]]; then
              echo "BASE_URL=http://${external_ip}" >> "$GITHUB_ENV"
              break
            fi

            kubectl -n "$K8S_NAMESPACE" get svc kong -o wide || true
            sleep 10
          done

          if [[ -z "$external_ip" ]]; then
            echo "Could not resolve staging Kong public IP." >&2
            exit 1
          fi

          kubectl -n "$K8S_NAMESPACE" port-forward svc/keycloak 18080:80 >/tmp/keycloak-pf.log 2>&1 &
          pf_pid="$!"
          trap 'kill "$pf_pid" >/dev/null 2>&1 || true' EXIT

          for i in {1..60}; do
            if curl -sf "http://127.0.0.1:18080/realms/${REALM}/.well-known/openid-configuration" >/dev/null; then
              break
            fi

            if ! kill -0 "$pf_pid" >/dev/null 2>&1; then
              echo "Keycloak port-forward stopped unexpectedly." >&2
              cat /tmp/keycloak-pf.log >&2 || true
              exit 1
            fi

            sleep 3
          done

          token_response="$(curl -sf -X POST \
            "http://127.0.0.1:18080/realms/${REALM}/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "client_id=${KEYCLOAK_CLIENT_ID}" \
            -d "client_secret=${KEYCLOAK_CLIENT_SECRET}" \
            -d "username=adminuser" \
            -d "password=${KEYCLOAK_TEST_PASSWORD}")"

          access_token="$(echo "$token_response" | jq -r '.access_token // empty')"

          if [[ -z "$access_token" || "$access_token" == "null" ]]; then
            echo "Keycloak did not return access_token." >&2
            echo "$token_response" | jq . >&2 || true
            exit 1
          fi

          echo "KEYCLOAK_ACCESS_TOKEN=${access_token}" >> "$GITHUB_ENV"
          echo "AUTHORIZATION_HEADER=Bearer ${access_token}" >> "$GITHUB_ENV"

      - name: Strong cloud health check
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -H "Authorization: Bearer ${KEYCLOAK_ACCESS_TOKEN}" "${BASE_URL}/api/health"

      - name: Strong cloud integration/acceptance tests
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          export BASE_URL="${BASE_URL}"
          export KEYCLOAK_ACCESS_TOKEN="${KEYCLOAK_ACCESS_TOKEN}"
          export AUTHORIZATION_HEADER="Bearer ${KEYCLOAK_ACCESS_TOKEN}"

          if [[ -f ./tests/staging_integration/run.sh ]]; then
            chmod +x ./tests/staging_integration/run.sh
            ./tests/staging_integration/run.sh
          else
            chmod +x ./tests/non_staging_integration/run.sh
            ./tests/non_staging_integration/run.sh
          fi

      - name: Kubernetes diagnostics on staging failure
        if: failure()
        shell: bash
        run: |
          set +e

          kubectl -n "$K8S_NAMESPACE" get pods,svc,hpa -o wide
          kubectl -n "$K8S_NAMESPACE" describe pods

          for deployment in \
            keycloak-db \
            keycloak \
            kong \
            api-gateway \
            author-analytics-service \
            author-catalog \
            book-catalog \
            book-recommendation \
            book-search \
            compare-service \
            genre-analysis-service \
            rating-catalog
          do
            echo "===== logs deployment/${deployment} ====="
            kubectl -n "$K8S_NAMESPACE" logs "deployment/${deployment}" --tail=160
          done

  promote-production:
    name: 05-07 Promote tested image to production
    runs-on: ubuntu-latest
    needs:
      - deploy-staging
    env:
      K8S_NAMESPACE: ${{ vars.PROD_NAMESPACE }}
      NAMESPACE: ${{ vars.PROD_NAMESPACE }}
      KONG_STATIC_IP_NAME: ${{ vars.PROD_KONG_STATIC_IP_NAME }}
      DATASET_GCS_URI: ${{ vars.PROD_DATASET_GCS_URI }}
      DATASET_DIR: data/data_clean/normalized_prod
      IMPORT_DATASET: ${{ vars.PROD_IMPORT_DATASET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Resolve scripts directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d scripts ]]; then
            echo "SCRIPTS_DIR=scripts" >> "$GITHUB_ENV"
          else
            echo "SCRIPTS_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$SCRIPTS_DIR"/*.sh

      - name: 02 - Get GKE credentials
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/02-cluster-access.sh"

      - name: 05 - Deploy production with same tested IMAGE_TAG
        shell: bash
        run: |
          set -euo pipefail
          printf 'YES\n' | "$SCRIPTS_DIR/05-deploy.sh"

      - name: Wait for auth/proxy deployments
        shell: bash
        run: |
          set -euo pipefail

          for deployment in keycloak-db keycloak; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${deployment}" --timeout="${ROLLOUT_TIMEOUT:-600s}"
          done

      - name: 07 - Configure production Keycloak/Kong JWT
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/07-keycloak.sh"

      - name: 06 - Import production dataset when enabled
        if: ${{ vars.PROD_IMPORT_DATASET == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          "$SCRIPTS_DIR/06-import-dataset.sh"

      - name: Production smoke check
        shell: bash
        run: |
          set -euo pipefail

          external_ip=""

          for i in {1..60}; do
            external_ip="$(kubectl -n "$K8S_NAMESPACE" get svc kong -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [[ -n "$external_ip" ]] && break
            sleep 10
          done

          if [[ -z "$external_ip" ]]; then
            echo "Could not resolve production Kong public IP." >&2
            exit 1
          fi

          curl -fsS "http://${external_ip}/status" || true
          kubectl -n "$K8S_NAMESPACE" get pods,svc,hpa -o wide

      - name: Kubernetes diagnostics on production failure
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl -n "$K8S_NAMESPACE" get pods,svc,hpa -o wide
          kubectl -n "$K8S_NAMESPACE" describe pods

  cleanup-staging:
    name: Cleanup staging environment
    runs-on: ubuntu-latest
    needs:
      - deploy-staging
      - promote-production
    if: always()
    env:
      K8S_NAMESPACE: ${{ vars.TEST_NAMESPACE }}
      NAMESPACE: ${{ vars.TEST_NAMESPACE }}
      KONG_STATIC_IP_NAME: ${{ vars.TEST_KONG_STATIC_IP_NAME }}
      CLEANUP_TEST_STATIC_IP: ${{ vars.CLEANUP_TEST_STATIC_IP }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        shell: bash
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --location "$GKE_LOCATION" \
            --project "$GCP_PROJECT_ID"

      - name: Delete only staging namespace and staging static IP
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting staging namespace: ${K8S_NAMESPACE}"
          kubectl delete namespace "$K8S_NAMESPACE" --ignore-not-found=true --wait=false || true

          if [[ "${CLEANUP_TEST_STATIC_IP:-true}" == "true" ]]; then
            echo "Deleting staging Kong static IP: ${KONG_STATIC_IP_NAME}"
            gcloud compute addresses delete "$KONG_STATIC_IP_NAME" \
              --region "${KONG_STATIC_IP_REGION:-$GKE_LOCATION}" \
              --project "$GCP_PROJECT_ID" \
              --quiet || true
          else
            echo "CLEANUP_TEST_STATIC_IP is not true. Keeping staging static IP."
          fi
