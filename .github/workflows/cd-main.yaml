name: CD - Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bookcloud-staging
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

  ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}

  IMAGE_PREFIX: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  GKE_MACHINE_TYPE: ${{ vars.GKE_MACHINE_TYPE }}
  GKE_NUM_NODES: ${{ vars.GKE_NUM_NODES }}

  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  ROLLOUT_TIMEOUT: ${{ vars.ROLLOUT_TIMEOUT }}
  KONG_STATIC_IP_NAME: ${{ vars.KONG_STATIC_IP_NAME }}
  KONG_STATIC_IP_REGION: ${{ vars.KONG_STATIC_IP_REGION }}

  DOCKER_BUILDKIT: "1"

jobs:
  setup-gke:
    name: Setup GKE infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            ARTIFACT_REGISTRY_LOCATION \
            ARTIFACT_REGISTRY_REPOSITORY \
            GKE_CLUSTER \
            GKE_LOCATION \
            K8S_NAMESPACE
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Variables:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin,kubectl

      - name: Enable required GCP APIs
        shell: bash
        run: |
          set -euo pipefail

          gcloud services enable \
            serviceusage.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            iamcredentials.googleapis.com \
            --project "$GCP_PROJECT_ID"

      - name: Ensure Artifact Registry exists
        shell: bash
        run: |
          set -euo pipefail

          if gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPOSITORY" \
            --location="$ARTIFACT_REGISTRY_LOCATION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repository already exists."
          else
            gcloud artifacts repositories create "$ARTIFACT_REGISTRY_REPOSITORY" \
              --repository-format=docker \
              --location="$ARTIFACT_REGISTRY_LOCATION" \
              --description="BookCloud container images" \
              --project="$GCP_PROJECT_ID"
          fi

      - name: Ensure GKE cluster exists
        shell: bash
        run: |
          set -euo pipefail

          GKE_MACHINE_TYPE="${GKE_MACHINE_TYPE:-e2-standard-2}"
          GKE_NUM_NODES="${GKE_NUM_NODES:-1}"
          GKE_DISK_SIZE_GB="30"

          cluster_status=""

          if gcloud container clusters describe "$GKE_CLUSTER" \
            --location="$GKE_LOCATION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then

            cluster_status="$(gcloud container clusters describe "$GKE_CLUSTER" \
              --location="$GKE_LOCATION" \
              --project="$GCP_PROJECT_ID" \
              --format="value(status)")"

            echo "GKE cluster exists with status: ${cluster_status}"

            if [[ "$cluster_status" != "RUNNING" ]]; then
              echo "Cluster exists but is not RUNNING. Deleting it before recreating..."

              gcloud container clusters delete "$GKE_CLUSTER" \
                --location="$GKE_LOCATION" \
                --project="$GCP_PROJECT_ID" \
                --quiet
            fi
          fi

          if ! gcloud container clusters describe "$GKE_CLUSTER" \
            --location="$GKE_LOCATION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then

            echo "GKE cluster does not exist. Creating cluster..."

            gcloud container clusters create "$GKE_CLUSTER" \
              --location="$GKE_LOCATION" \
              --num-nodes="$GKE_NUM_NODES" \
              --machine-type="$GKE_MACHINE_TYPE" \
              --disk-type="pd-standard" \
              --disk-size="$GKE_DISK_SIZE_GB" \
              --enable-ip-alias \
              --project="$GCP_PROJECT_ID"
          fi

          echo "Waiting for GKE cluster to be RUNNING..."

          for i in {1..60}; do
            cluster_status="$(gcloud container clusters describe "$GKE_CLUSTER" \
              --location="$GKE_LOCATION" \
              --project="$GCP_PROJECT_ID" \
              --format="value(status)")"

            echo "Cluster status: ${cluster_status}"

            if [[ "$cluster_status" == "RUNNING" ]]; then
              echo "GKE cluster is RUNNING."
              exit 0
            fi

            sleep 10
          done

          echo "GKE cluster did not become RUNNING in time." >&2
          exit 1

      - name: Ensure Kubernetes namespace exists
        shell: bash
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --location="$GKE_LOCATION" \
            --project="$GCP_PROJECT_ID"

          echo "Waiting for Kubernetes API to respond..."

          for i in {1..60}; do
            if kubectl version --request-timeout=10s >/dev/null 2>&1; then
              echo "Kubernetes API is reachable."
              break
            fi

            echo "Kubernetes API not ready yet. Retrying..."
            sleep 10

            if [[ "$i" == "60" ]]; then
              echo "Kubernetes API did not become reachable in time." >&2
              exit 1
            fi
          done

          kubectl create namespace "$K8S_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply --validate=false -f -

  build-and-push-images:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - setup-gke

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: src/api-gateway
            dockerfile: src/api-gateway/Dockerfile

          - service: author-analytics-service
            context: src/services/author-analytics-service
            dockerfile: src/services/author-analytics-service/Dockerfile

          - service: author-catalog
            context: src/services/author-catalog
            dockerfile: src/services/author-catalog/Dockerfile

          - service: book-catalog
            context: src/services/book-catalog
            dockerfile: src/services/book-catalog/Dockerfile

          - service: book-recommendation
            context: src/services/book-recommendation
            dockerfile: src/services/book-recommendation/Dockerfile

          - service: book-search
            context: .
            dockerfile: src/services/book-search/Dockerfile

          - service: compare-service
            context: src/services/compare-service
            dockerfile: src/services/compare-service/Dockerfile

          - service: genre-analysis-service
            context: src/services/genre-analysis-service
            dockerfile: src/services/genre-analysis-service/Dockerfile

          - service: rating-catalog
            context: src/services/rating-catalog
            dockerfile: src/services/rating-catalog/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_PREFIX}/${{ matrix.service }}"

          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${image}:${IMAGE_TAG}" \
            --tag "${image}:main" \
            --push \
            "${{ matrix.context }}"

  deploy-staging:
    name: Deploy to GKE staging
    runs-on: ubuntu-latest
    needs:
      - build-and-push-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            ARTIFACT_REGISTRY_LOCATION \
            ARTIFACT_REGISTRY_REPOSITORY \
            GKE_CLUSTER \
            GKE_LOCATION \
            K8S_NAMESPACE
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Variables:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin,kubectl

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Reserve Kong static IP
        shell: bash
        run: |
          set -euo pipefail

          KONG_STATIC_IP_NAME="${KONG_STATIC_IP_NAME:-bookcloud-kong-ip}"
          KONG_STATIC_IP_REGION="${KONG_STATIC_IP_REGION:-$GKE_LOCATION}"

          echo "Using Kong static IP name: ${KONG_STATIC_IP_NAME}"
          echo "Using Kong static IP region: ${KONG_STATIC_IP_REGION}"

          if gcloud compute addresses describe "$KONG_STATIC_IP_NAME" \
            --region "$KONG_STATIC_IP_REGION" \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Kong static IP already exists."
          else
            echo "Creating Kong static IP..."
            gcloud compute addresses create "$KONG_STATIC_IP_NAME" \
              --region "$KONG_STATIC_IP_REGION" \
              --project "$GCP_PROJECT_ID"
          fi

          kong_static_ip="$(gcloud compute addresses describe "$KONG_STATIC_IP_NAME" \
            --region "$KONG_STATIC_IP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format="value(address)")"

          if [[ -z "$kong_static_ip" ]]; then
            echo "Could not resolve reserved Kong static IP." >&2
            exit 1
          fi

          echo "KONG_STATIC_IP=${kong_static_ip}" >> "$GITHUB_ENV"
          echo "KONG_STATIC_IP_NAME=${KONG_STATIC_IP_NAME}" >> "$GITHUB_ENV"
          echo "KONG_STATIC_IP_REGION=${KONG_STATIC_IP_REGION}" >> "$GITHUB_ENV"
          echo "Reserved Kong static IP: ${kong_static_ip}"

      - name: Render Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          KONG_STATIC_IP="${KONG_STATIC_IP:?KONG_STATIC_IP is required}"
          rendered_dir="${RUNNER_TEMP}/bookcloud-k8s"
          rm -rf "$rendered_dir"
          cp -R k8s "$rendered_dir"

          services=(
            api-gateway
            author-analytics-service
            author-catalog
            book-catalog
            book-recommendation
            book-search
            compare-service
            genre-analysis-service
            rating-catalog
          )

          for service in "${services[@]}"; do
            deployment_file="${rendered_dir}/${service}/deployment.yaml"
            image="${IMAGE_PREFIX}/${service}:${IMAGE_TAG}"

            if [[ ! -f "$deployment_file" ]]; then
              echo "Deployment file not found: $deployment_file" >&2
              exit 1
            fi

            sed -i "s#image: bookcloud/${service}:latest#image: ${image}#g" "$deployment_file"

            if ! grep -F "image: ${image}" "$deployment_file" >/dev/null; then
              echo "Image replacement failed for ${service}" >&2
              exit 1
            fi
          done

          find "$rendered_dir" -name deployment.yaml -exec sed -i 's/imagePullPolicy: IfNotPresent/imagePullPolicy: Always/g' {} +

          kong_service_file="${rendered_dir}/kong/service.yaml"

          if [[ ! -f "$kong_service_file" ]]; then
            echo "Kong service manifest not found: $kong_service_file" >&2
            exit 1
          fi

          if grep -q '^[[:space:]]*loadBalancerIP:' "$kong_service_file"; then
            sed -i "s#^[[:space:]]*loadBalancerIP:.*#  loadBalancerIP: ${KONG_STATIC_IP}#g" "$kong_service_file"
          else
            sed -i "/^[[:space:]]*type: LoadBalancer/a\\  loadBalancerIP: ${KONG_STATIC_IP}" "$kong_service_file"
          fi

          if ! grep -F "loadBalancerIP: ${KONG_STATIC_IP}" "$kong_service_file" >/dev/null; then
            echo "Kong static IP replacement failed." >&2
            exit 1
          fi

          kubectl create configmap keycloak-realm \
            --from-file=bookcloud-realm.json=k8s/keycloak/bookcloud-realm.json \
            --namespace "$K8S_NAMESPACE" \
            --dry-run=client \
            -o yaml > "$rendered_dir/keycloak/realm-configmap.yaml"

          echo "RENDERED_K8S_DIR=$rendered_dir" >> "$GITHUB_ENV"

      - name: Install monitoring stack with Helm
        shell: bash
        run: |
          set -euo pipefail

          MONITORING_NAMESPACE="monitoring"
          MONITORING_RELEASE_NAME="monitoring"
          MONITORING_VALUES_FILE="k8s/monitoring/values-gke.yaml"

          if command -v helm >/dev/null 2>&1; then
            echo "Helm already installed."
          else
            echo "Installing Helm..."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          kubectl create namespace "$MONITORING_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
          helm repo update

          if [[ -f "$MONITORING_VALUES_FILE" ]]; then
            helm upgrade --install "$MONITORING_RELEASE_NAME" prometheus-community/kube-prometheus-stack \
              --namespace "$MONITORING_NAMESPACE" \
              --values "$MONITORING_VALUES_FILE" \
              --wait \
              --timeout 10m
          else
            echo "Monitoring values file not found: $MONITORING_VALUES_FILE"
            echo "Installing kube-prometheus-stack with default values..."

            helm upgrade --install "$MONITORING_RELEASE_NAME" prometheus-community/kube-prometheus-stack \
              --namespace "$MONITORING_NAMESPACE" \
              --wait \
              --timeout 10m
          fi

          echo "Waiting for ServiceMonitor CRD..."

          for i in {1..60}; do
            if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
              echo "ServiceMonitor CRD is available."
              exit 0
            fi

            echo "ServiceMonitor CRD not ready yet. Retrying..."
            sleep 5
          done

          echo "ServiceMonitor CRD was not installed in time." >&2
          exit 1

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k "$RENDERED_K8S_DIR"

      - name: Wait for application rollouts
        shell: bash
        run: |
          set -euo pipefail

          ROLLOUT_TIMEOUT="${ROLLOUT_TIMEOUT:-1200s}"

          deployments=(
            keycloak-db
            keycloak
            kong
            api-gateway
            author-analytics-service
            author-catalog
            book-catalog
            book-recommendation
            book-search
            compare-service
            genre-analysis-service
            rating-catalog
          )

          for deployment in "${deployments[@]}"; do
            echo "Waiting for rollout: ${deployment}"

            if ! kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${deployment}" --timeout="$ROLLOUT_TIMEOUT"; then
              echo "Rollout failed for ${deployment}" >&2

              echo "=== Deployment describe: ${deployment} ==="
              kubectl -n "$K8S_NAMESPACE" describe deployment "$deployment" || true

              echo "=== Pods ==="
              kubectl -n "$K8S_NAMESPACE" get pods -o wide || true

              echo "=== Matching pods describe: app=${deployment} ==="
              kubectl -n "$K8S_NAMESPACE" describe pods -l app="$deployment" || true

              echo "=== Logs: ${deployment} ==="
              kubectl -n "$K8S_NAMESPACE" logs "deployment/${deployment}" --tail=200 || true

              exit 1
            fi
          done

          kubectl -n "$K8S_NAMESPACE" get pods,svc,hpa -o wide

      - name: Resolve staging base URL from Kubernetes LoadBalancer
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Kong LoadBalancer endpoint in namespace ${K8S_NAMESPACE}..."
          kubectl -n "$K8S_NAMESPACE" get svc kong -o wide || true

          for i in {1..60}; do
            external_ip="$(kubectl -n "$K8S_NAMESPACE" get svc kong \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"

            external_hostname="$(kubectl -n "$K8S_NAMESPACE" get svc kong \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"

            if [[ -n "$external_ip" ]]; then
              staging_base_url="http://${external_ip}"
              echo "STAGING_BASE_URL=${staging_base_url}" >> "$GITHUB_ENV"
              echo "Resolved STAGING_BASE_URL=${staging_base_url}"

              if [[ -n "${KONG_STATIC_IP:-}" && "$external_ip" != "$KONG_STATIC_IP" ]]; then
                echo "Warning: Kong external IP ${external_ip} differs from reserved IP ${KONG_STATIC_IP}." >&2
              fi

              exit 0
            fi

            if [[ -n "$external_hostname" ]]; then
              staging_base_url="http://${external_hostname}"
              echo "STAGING_BASE_URL=${staging_base_url}" >> "$GITHUB_ENV"
              echo "Resolved STAGING_BASE_URL=${staging_base_url}"
              exit 0
            fi

            echo "Kong LoadBalancer endpoint is still pending."
            kubectl -n "$K8S_NAMESPACE" get svc -o wide || true

            sleep 10
          done

          echo "Could not resolve Kong public LoadBalancer endpoint in time." >&2
          kubectl -n "$K8S_NAMESPACE" get svc -o wide || true
          kubectl -n "$K8S_NAMESPACE" describe svc kong || true
          exit 1

      - name: Obtain Keycloak access token
        shell: bash
        run: |
          set -euo pipefail

          echo "Reading Keycloak realm from configmap..."

          realm_json="$(kubectl -n "$K8S_NAMESPACE" get configmap keycloak-realm \
            -o jsonpath='{.data.bookcloud-realm\.json}' 2>/dev/null || true)"

          if [[ -z "$realm_json" ]]; then
            echo "Could not read bookcloud-realm.json from configmap keycloak-realm." >&2
            kubectl -n "$K8S_NAMESPACE" get configmap keycloak-realm -o yaml || true
            exit 1
          fi

          echo "$realm_json" > /tmp/bookcloud-realm.json

          realm="$(jq -r '.realm // empty' /tmp/bookcloud-realm.json)"

          client_id="$(jq -r '
            [
              .clients[]?
              | select((.directAccessGrantsEnabled == true) and (.clientId != "account"))
              | .clientId
            ][0] // empty
          ' /tmp/bookcloud-realm.json)"

          client_secret="$(jq -r --arg client_id "$client_id" '
            .clients[]?
            | select(.clientId == $client_id)
            | .secret // empty
          ' /tmp/bookcloud-realm.json)"

          username="$(jq -r '
            [
              .users[]?
              | select(.enabled != false)
              | .username
            ][0] // empty
          ' /tmp/bookcloud-realm.json)"

          password="$(jq -r '
            [
              .users[]?.credentials[]?
              | select(.type == "password")
              | .value
            ][0] // empty
          ' /tmp/bookcloud-realm.json)"

          if [[ -z "$realm" || -z "$client_id" || -z "$username" || -z "$password" ]]; then
            echo "Could not infer realm/client/user/password from keycloak-realm configmap." >&2
            echo "realm=$realm"
            echo "client_id=$client_id"
            echo "username=$username"
            echo "password_present=$([[ -n "$password" ]] && echo yes || echo no)"
            exit 1
          fi

          echo "Realm: $realm"
          echo "Client ID: $client_id"
          echo "Username: $username"

          echo "Starting port-forward to Keycloak..."

          kubectl -n "$K8S_NAMESPACE" port-forward service/keycloak 18080:80 >/tmp/keycloak-port-forward.log 2>&1 &
          pf_pid="$!"

          cleanup() {
            kill "$pf_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Waiting for Keycloak to respond through port-forward..."

          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:18080/realms/${realm}/.well-known/openid-configuration" >/dev/null 2>&1; then
              echo "Keycloak is reachable."
              break
            fi

            echo "Keycloak not reachable yet. Retrying..."
            cat /tmp/keycloak-port-forward.log || true
            sleep 5

            if [[ "$i" == "60" ]]; then
              echo "Keycloak did not become reachable in time." >&2
              cat /tmp/keycloak-port-forward.log || true
              exit 1
            fi
          done

          token_args=(
            -sS
            -X POST
            "http://127.0.0.1:18080/realms/${realm}/protocol/openid-connect/token"
            -H "Content-Type: application/x-www-form-urlencoded"
            -d "grant_type=password"
            -d "client_id=${client_id}"
            -d "username=${username}"
            -d "password=${password}"
          )

          if [[ -n "$client_secret" ]]; then
            token_args+=(-d "client_secret=${client_secret}")
          fi

          token_response="$(curl "${token_args[@]}")"

          access_token="$(echo "$token_response" | jq -r '.access_token // empty')"

          if [[ -z "$access_token" || "$access_token" == "null" ]]; then
            echo "Failed to obtain Keycloak access token." >&2
            echo "$token_response" | jq . || echo "$token_response"
            exit 1
          fi

          echo "KEYCLOAK_ACCESS_TOKEN=${access_token}" >> "$GITHUB_ENV"

          echo "Keycloak access token obtained successfully."

      - name: Wait for public staging endpoint
        shell: bash
        env:
          TIMEOUT_SECONDS: 300
          INTERVAL_SECONDS: 10
        run: |
          set -euo pipefail

          BASE_URL="${STAGING_BASE_URL:?STAGING_BASE_URL is not set}"
          KEYCLOAK_ACCESS_TOKEN="${KEYCLOAK_ACCESS_TOKEN:?KEYCLOAK_ACCESS_TOKEN is not set}"
          API_BASE_URL="${BASE_URL}/api"
          HEALTH_URL="${API_BASE_URL}/health"

          probe_url() {
            local label="$1"
            local url="$2"
            local auth_mode="${3:-none}"
            local output_file="/tmp/bookcloud-health-${label//[^A-Za-z0-9_-]/_}.txt"
            local http_code
            local curl_args=(
              --max-time 20
              --connect-timeout 5
              -sS
              -o "$output_file"
              -w "%{http_code}"
            )

            if [[ "$auth_mode" == "bearer" ]]; then
              curl_args+=(-H "Authorization: Bearer ${KEYCLOAK_ACCESS_TOKEN}")
            fi

            http_code="$(curl "${curl_args[@]}" "$url" || true)"

            echo "=== Probe: ${label} ==="
            echo "URL: ${url}"
            echo "HTTP status: ${http_code}"
            echo "Response body:"
            cat "$output_file" || true
            echo

            LAST_HTTP_CODE="$http_code"
          }

          echo "Waiting for authenticated API Gateway health at ${HEALTH_URL}..."

          elapsed=0

          while [ "$elapsed" -lt "$TIMEOUT_SECONDS" ]; do
            probe_url "kong-status-no-token" "${BASE_URL}/status"
            probe_url "root-health-no-token" "${BASE_URL}/health"
            probe_url "api-health-no-token" "${BASE_URL}/api/health"
            probe_url "api-health-with-token" "$HEALTH_URL" bearer

            if [ "$LAST_HTTP_CODE" = "200" ]; then
              echo "Authenticated public staging endpoint is healthy."
              exit 0
            fi

            sleep "$INTERVAL_SECONDS"
            elapsed=$((elapsed + INTERVAL_SECONDS))
          done

          echo "Public staging endpoint did not become healthy in time." >&2

          echo "=== Services ==="
          kubectl -n "$K8S_NAMESPACE" get svc -o wide || true

          echo "=== Pods ==="
          kubectl -n "$K8S_NAMESPACE" get pods -o wide || true

          echo "=== Kong Service ==="
          kubectl -n "$K8S_NAMESPACE" describe svc kong || true

          echo "=== API Gateway Deployment ==="
          kubectl -n "$K8S_NAMESPACE" describe deployment api-gateway || true

          echo "=== Keycloak Deployment ==="
          kubectl -n "$K8S_NAMESPACE" describe deployment keycloak || true

          echo "=== Kong logs ==="
          kubectl -n "$K8S_NAMESPACE" logs deployment/kong --tail=200 || true

          echo "=== API Gateway logs ==="
          kubectl -n "$K8S_NAMESPACE" logs deployment/api-gateway --tail=200 || true

          echo "=== Keycloak logs ==="
          kubectl -n "$K8S_NAMESPACE" logs deployment/keycloak --tail=200 || true

          exit 1

      - name: Run staging integration tests
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          export BASE_URL="${STAGING_BASE_URL:?STAGING_BASE_URL is not set}"
          export KEYCLOAK_ACCESS_TOKEN="${KEYCLOAK_ACCESS_TOKEN:?KEYCLOAK_ACCESS_TOKEN is not set}"
          export AUTHORIZATION_HEADER="Bearer ${KEYCLOAK_ACCESS_TOKEN}"

          if [[ -f ./tests/staging_integration/run.sh ]]; then
            chmod +x ./tests/staging_integration/run.sh
            ./tests/staging_integration/run.sh
          else
            chmod +x ./tests/non_staging_integration/run.sh
            ./tests/non_staging_integration/run.sh
          fi

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        shell: bash
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods,svc,hpa -o wide || true
          kubectl -n "$K8S_NAMESPACE" describe pods || true

          for deployment in \
            keycloak-db \
            keycloak \
            kong \
            api-gateway \
            author-analytics-service \
            author-catalog \
            book-catalog \
            book-recommendation \
            book-search \
            compare-service \
            genre-analysis-service \
            rating-catalog
          do
            kubectl -n "$K8S_NAMESPACE" logs "deployment/${deployment}" --tail=120 || true
          done
