name: CI - Dev Branch

on:
  push:
    branches:
      - dev

jobs:
  rust-unit-tests:
    name: Rust services - build and unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package:
          - api-gateway
          - book-search
          - rating-catalog
          - author-analytics-service
          - book-recommendation
          - author-catalog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint Rust service with Clippy
        run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings -A dead_code

      - name: Build Rust service
        run: cargo build -p ${{ matrix.package }} --verbose

      - name: Run Rust unit tests
        run: cargo test -p ${{ matrix.package }} --verbose

  python-unit-tests:
    name: Python services - unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          # - src/services/book-catalog
          # - src/services/genre-analysis-service
          - src/services/compare-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Python service with flake8
        working-directory: ${{ matrix.service }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=generated,generated_protos
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=generated,generated_protos

      - name: Run Python unit tests
        working-directory: ${{ matrix.service }}
        run: pytest -v
