name: CI - Dev Branch

on:
  push:
    branches:
      - dev

jobs:
  rust-unit-tests:
    name: Rust services - build and unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - src/api-gateway
          - src/services/book-catalog
          - src/services/book-search
          - src/services/rating-catalog
          - src/services/author-analytics-service
          - src/services/book-recommendation
          - src/services/book-search

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust service
        working-directory: ${{ matrix.service }}
        run: cargo build --verbose

      - name: Run Rust unit tests
        working-directory: ${{ matrix.service }}
        run: cargo test --verbose

  python-unit-tests:
    name: Python services - unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - src/services/genre-analysis-service
          - src/services/compare-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Python unit tests
        working-directory: ${{ matrix.service }}
        run: pytest -v
