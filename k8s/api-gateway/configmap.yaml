apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: bookcloud
data:
  SERVICE_NAME: "api-gateway"
  HOST: "0.0.0.0"
  API_PORT: "8080"
  RUST_LOG: "info"
  BOOK_CATALOG_GRPC_URL:        "http://book-catalog:50051"
  AUTHOR_CATALOG_GRPC_URL:      "http://author-catalog:50052"
  RATING_CATALOG_GRPC_URL:      "http://rating-catalog:50053"
  COMPARE_SERVICE_GRPC_URL:     "http://compare-service:50054"
  GENRE_ANALYSIS_GRPC_URL:      "http://genre-analysis-service:50055"
  AUTHOR_ANALYTICS_GRPC_URL:    "http://author-analytics-service:50056"
  BOOK_SEARCH_GRPC_URL:         "http://book-search:50057"
  BOOK_RECOMMENDATION_GRPC_URL: "http://book-recommendation:50055"
  # ── Keycloak (adicionado para o auth_handler) ──────────────────────────
  KEYCLOAK_URL: "http://keycloak:80"
  KEYCLOAK_CLIENT_ID: "bookcloud-app"
  KEYCLOAK_CLIENT_SECRET: "bookcloud-app-secret"
  KEYCLOAK_ADMIN_CLIENT_ID: "bookcloud-app"
  KEYCLOAK_ADMIN_SECRET: "bookcloud-app-secret"