apiVersion: apps/v1
kind: Deployment
metadata:
  name: author-catalog
  namespace: bookcloud
  labels:
    app: author-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: author-catalog
  template:
    metadata:
      labels:
        app: author-catalog
    spec:
      containers:
        - name: author-catalog
          image: bookcloud/author-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: author-catalog-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "400m"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
