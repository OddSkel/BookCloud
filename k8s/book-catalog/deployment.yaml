apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalog
  namespace: bookcloud
  labels:
    app: book-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-catalog
  template:
    metadata:
      labels:
        app: book-catalog
    spec:
      containers:
        - name: book-catalog
          image: bookcloud/book-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: book-catalog-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: "750m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
