apiVersion: v1
kind: Service
metadata:
  name: book-catalog
  namespace: bookcloud
  labels:
    app: book-catalog
spec:
  type: ClusterIP
  selector:
    app: book-catalog
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9100
      targetPort: 9100