apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-recommendation
  namespace: bookcloud
  labels:
    app: book-recommendation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-recommendation
  template:
    metadata:
      labels:
        app: book-recommendation
    spec:
      containers:
        - name: book-recommendation
          image: bookcloud/book-recommendation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50056
          envFrom:
            - configMapRef:
                name: book-recommendation-config
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
