apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-redis
  namespace: bookcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-redis
  template:
    metadata:
      labels:
        app: book-redis
    spec:
      containers:
        - name: book-redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
