apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-search
  namespace: bookcloud
  labels:
    app: book-search
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: book-search
  template:
    metadata:
      labels:
        app: book-search
    spec:
      containers:
        - name: book-search
          image: bookcloud/book-search:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50057
          envFrom:
            - configMapRef:
                name: book-search-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
