apiVersion: apps/v1
kind: Deployment
metadata:
  name: compare-service
  namespace: bookcloud
  labels:
    app: compare-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compare-service
  template:
    metadata:
      labels:
        app: compare-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: compare-service
          image: bookcloud/compare-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50054
          envFrom:
            - configMapRef:
                name: compare-service-config
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
