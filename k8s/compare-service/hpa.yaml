apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compare-service
  namespace: bookcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compare-service
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70