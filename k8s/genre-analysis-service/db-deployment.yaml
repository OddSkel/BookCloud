apiVersion: apps/v1
kind: Deployment
metadata:
  name: genre-db
  namespace: bookcloud
  labels:
    app: genre-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genre-db
  template:
    metadata:
      labels:
        app: genre-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: genre-db-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: genre-db-data