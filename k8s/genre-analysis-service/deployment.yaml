apiVersion: apps/v1
kind: Deployment
metadata:
  name: genre-analysis-service
  namespace: bookcloud
  labels:
    app: genre-analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genre-analysis-service
  template:
    metadata:
      labels:
        app: genre-analysis-service
    spec:
      containers:
        - name: genre-analysis-service
          image: bookcloud/genre-analysis-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50055
          envFrom:
            - configMapRef:
                name: genre-analysis-service-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
