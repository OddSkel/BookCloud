apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: bookcloud
  labels:
    app: keycloak
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0
        imagePullPolicy: IfNotPresent
        args:
          - start-dev
          - --import-realm
        envFrom:
          - configMapRef:
              name: keycloak-config
        env:
          - name: KC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: POSTGRES_PASSWORD
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: POSTGRES_PASSWORD
        ports:
          - name: http
            containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: realm-config
            mountPath: /opt/keycloak/data/import
            readOnly: true
        startupProbe:
          httpGet:
            path: /health/started
            port: http
          initialDelaySeconds: 30  
          periodSeconds: 10
          failureThreshold: 20      
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 0
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 10
          timeoutSeconds: 3
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm