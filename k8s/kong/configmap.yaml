apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: bookcloud
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: bookcloud-api-gateway
        url: http://api-gateway:80
        connect_timeout: 60000
        write_timeout: 60000
        read_timeout: 300000
        routes:
          - name: public-routes
            paths:
              - /health
            strip_path: false
          - name: protected-routes
            paths:
              - /
            strip_path: false

    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
          max_age: 3600
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
          size_unit: megabytes
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Powered-By: BookCloud"
