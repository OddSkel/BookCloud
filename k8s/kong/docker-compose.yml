services:
  kong:
    image: kong:3.7
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN}"
      KONG_LOG_LEVEL: "${KONG_LOG_LEVEL}"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT}:9000"   # public proxy — clients hit this
      - "${KONG_ADMIN_PORT}:9001"   # admin API
    networks:
      - bookcloud-network
    restart: unless-stopped

networks:
  bookcloud-network:
    external: true