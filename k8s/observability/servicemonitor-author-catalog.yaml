apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: author-catalog
  namespace: bookcloud
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: author-catalog
  namespaceSelector:
    matchNames:
      - bookcloud
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
