services:
  kong:
    image: kong:3.7
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:9000"
      KONG_ADMIN_LISTEN: "0.0.0.0:9001"
      KONG_LOG_LEVEL: info
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "9000:9000"   # public proxy — clients hit this
      - "9001:9001"   # admin API
    networks:
      - bookcloud-network
    restart: unless-stopped

networks:
  bookcloud-network:
    external: true