_format_version: "3.0"
_transform: true

services:
  - name: bookcloud-api-gateway
    url: http://api-gateway-api-gateway-1:8080
    routes:
      - name: all-routes
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 100
      hour: 1000
      policy: local

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
      max_age: 3600

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: BookCloud"