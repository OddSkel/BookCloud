[package]
name = "author-analytics-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic        = "0.12"
prost        = "0.13"
actix-web    = "4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
dotenv       = "0.15"
sqlx         = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

[build-dependencies]
tonic-build          = "0.12"
protoc-bin-vendored  = "3"