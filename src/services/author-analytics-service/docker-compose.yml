services:
  author-analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: author-analytics-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUST_LOG: info
      HOST: "0.0.0.0"
      GRPC_PORT: "50056"
      HTTP_PORT: "8086"
    ports:
      - "50058:50056"
    networks:
      - bookcloud-network

networks:
  bookcloud-network:
    external: true