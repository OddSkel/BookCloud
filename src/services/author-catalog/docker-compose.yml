services:
  author-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUST_LOG: info
    ports:
      - "${HOST_GRPC_PORT}:50052"
    networks:
      - bookcloud-network
    depends_on:
      - postgres

networks:
  bookcloud-network:
    external: true