services:
  author-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUST_LOG: info
      HOST: "0.0.0.0"
      GRPC_PORT: "50052"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://author-redis:6379"
    ports:
      - "${HOST_GRPC_PORT}:50052"
    networks:
      - bookcloud-network
    depends_on:
      - author-db
      - author-redis

  author-db:
    image: postgres:15
    container_name: author-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - author-db-data:/var/lib/postgresql/data
    networks:
      - bookcloud-network

  author-redis:
    image: redis:7
    container_name: author-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bookcloud-network

volumes:
  author-db-data:

networks:
  bookcloud-network:
    external: true
