services:
  book-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_GRPC_PORT}:50051"
    networks:
      - bookcloud-network

  book-db:
    image: postgres:15
    container_name: book-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - book-db-data:/var/lib/postgresql/data
    networks:
      - bookcloud-network

volumes:
  book-db-data:

networks:
  bookcloud-network:
    external: true