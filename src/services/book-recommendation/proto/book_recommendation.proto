syntax = "proto3";
import "common.proto";

package book_recommendation;

service BookRecommendationGrpc {

  rpc Book_Recommendation(Query) returns (BookRecommendationResponse);

  rpc HealthCheck (common.HealthCheckRequest) returns (common.HealthCheckResponse);
}

message Empty{}

message Query {
  optional string genre = 1;
  optional double rating = 2;
  optional double popularity = 3;
}

message Book {
  int32 id = 1;
  string name = 2;
  string author = 3;
  int32 isbn = 4;
  int32 year_published = 5;
  string editor = 6;
  int32 edition_number = 7;
  string genre = 8;
  optional string summary = 9;
}

message BookRecommendationResponse {
  repeated Book books = 1;
}