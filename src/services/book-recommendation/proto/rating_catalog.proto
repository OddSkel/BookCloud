syntax = "proto3";

package gateway.ratingcatalog;

import "common.proto";

message Rating {
  string book_isbn   = 1;
  int64  num_ratings = 2;
  double star_rating = 3;
}

message RatingAdd {
  int64  num_ratings = 1;
  double star_rating = 2;
}

message GetRatingsRequest  {
  optional int64 page_number = 1;
  optional int64 page_size = 2;
}

message GetRatingsResponse { repeated Rating ratings = 1; }

message GetRatingRequest   { string book_isbn = 1; }

message GetRatingResponse  { Rating rating = 1; }

message AddRatingRequest  { string book_isbn = 1; RatingAdd rating = 2; }

message AddRatingResponse { Rating rating = 1; }

message UpdateRatingRequest {
  string book_isbn   = 1;
  int64  num_ratings = 2;
  double star_rating = 3;
}

message UpdateRatingResponse { repeated Rating ratings = 1; }

message DeleteRatingRequest  { string book_isbn = 1; }

message DeleteRatingResponse {}

message GetBooksByRatingRequest {
  double min_rating = 1;
  int32 page_num = 2;
  int32 page_size = 3;
}

message BookRatingInfo {
  string book_isbn = 1;
  int64 num_ratings = 2;
  double star_rating = 3;
}

message GetBooksByRatingResponse {
  repeated BookRatingInfo items = 1;
  int32 page_num = 2;
  int32 page_size = 3;
  int32 total_items = 4;
  int32 total_pages = 5;
}

message GetBooksByPopularityRequest {
  int32 min_num_ratings = 1;
  int32 page_num = 2;
  int32 page_size = 3;
}

message GetBooksByPopularityResponse {
  repeated BookRatingInfo items = 1;
  int32 page_num = 2;
  int32 page_size = 3;
  int32 total_items = 4;
  int32 total_pages = 5;
}

service RatingCatalogGrpc {
  // rpc HealthCheck   (HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetRatings    (GetRatingsRequest)    returns (GetRatingsResponse);
  rpc GetRating     (GetRatingRequest)     returns (GetRatingResponse);
  rpc AddRating     (AddRatingRequest)     returns (AddRatingResponse);
  rpc UpdateRating  (UpdateRatingRequest)  returns (UpdateRatingResponse);
  rpc DeleteRating  (DeleteRatingRequest)  returns (DeleteRatingResponse);
  rpc GetBooksByRating(GetBooksByRatingRequest) returns (GetBooksByRatingResponse);
  rpc GetBooksByPopularity(GetBooksByPopularityRequest) returns (GetBooksByPopularityResponse);
}
