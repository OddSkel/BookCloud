services:
  book-search:
    build:
      context: ../../..
      dockerfile: src/services/book-search/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUST_LOG: info
    ports:
      - "${HOST_GRPC_PORT}:50054"
    networks:
      - bookcloud-network

networks:
  bookcloud-network:
    external: true