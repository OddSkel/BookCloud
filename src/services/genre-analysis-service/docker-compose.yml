services:
  genre-analysis-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_GRPC_PORT}:50055"
    networks:
      - genrecloud-network
    
  genre-db:
    image: postgres:15
    container_name: genre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - genre-db-data:/var/lib/postgresql/data
    networks:
      - genrecloud-network
  
volumes:
  genre-db-data:

networks:
  genrecloud-network:
    external: true